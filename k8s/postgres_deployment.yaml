---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres-deployment
  labels:
    app: postgres
spec:
  template:
    metadata:
      name: postgres-pod
      labels:
        app: postgres
    spec:
      volumes:
        - name: petclinic-data
          persistentVolumeClaim:
            claimName: petclinic-data-claim
      containers:
        - name: db
          image: postgres:15-alpine
          env:
            - name: POSTGRES_DB
              value: petclinic
            - name: POSTGRES_USER
              value: petclinic
            - name: POSTGRES_PASSWORD
              value: petclinic
          volumeMounts:
            - mountPath: "/var/lib/postgresql/data"
              name: petclinic-data
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: postgres
